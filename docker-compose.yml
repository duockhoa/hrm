services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hrm}
      MYSQL_USER: ${MYSQL_USER:-hrm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: ./backend
      target: migrator
    command: npx prisma migrate deploy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-hrm}:${MYSQL_PASSWORD:-change_me}@mysql:3306/${MYSQL_DATABASE:-hrm}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3012
      SWAGGER_PORT: 50000
      DATABASE_URL: mysql://${MYSQL_USER:-hrm}:${MYSQL_PASSWORD:-change_me}@mysql:3306/${MYSQL_DATABASE:-hrm}
    ports:
      - "${BACKEND_PORT:-3012}:3012"
      - "${SWAGGER_PORT:-50000}:50000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3012').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:3012}
        NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-}
        NEXT_PUBLIC_APP_REQUEST_URL: ${NEXT_PUBLIC_APP_REQUEST_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_EBR_URL: ${NEXT_PUBLIC_APP_EBR_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_WMS_URL: ${NEXT_PUBLIC_APP_WMS_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_SCB_URL: ${NEXT_PUBLIC_APP_SCB_URL:-http://localhost:3000}
        NEXT_PUBLIC_REQUIRED_APP_KEY: ${NEXT_PUBLIC_REQUIRED_APP_KEY:-hrm}
        NEXT_PUBLIC_APP_UNAUTHORIZED_REDIRECT_URL: ${NEXT_PUBLIC_APP_UNAUTHORIZED_REDIRECT_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COOKIE_HTTP_ONLY: ${COOKIE_HTTP_ONLY:-true}
      NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backend_uploads:
